<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Luminus: WhatsApp AI assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b141a"/>
      <stop offset="1" stop-color="#101d25"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25d366"/>
      <stop offset="0.45" stop-color="#e9fff1"/>
      <stop offset="0.55" stop-color="#e9fff1"/>
      <stop offset="1" stop-color="#25d366"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25d366" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#25d366" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, Consolas, 'Liberation Mono', monospace; }
      .in1 { opacity: 0; animation: pop 12s infinite; animation-delay: 0.6s; }
      .typing { opacity: 0; animation: typing 12s infinite; animation-delay: 1.8s; }
      .out1 { opacity: 0; animation: pop 12s infinite; animation-delay: 4.2s; }
      .in2 { opacity: 0; animation: pop 12s infinite; animation-delay: 6.2s; }
      .out2 { opacity: 0; animation: pop 12s infinite; animation-delay: 8.2s; }
      @keyframes pop {
        0% { opacity: 0; transform: translateY(12px); }
        4% { opacity: 1; transform: translateY(0); }
        88% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @keyframes typing {
        0% { opacity: 0; } 3% { opacity: 1; } 18% { opacity: 1; } 21%, 100% { opacity: 0; }
      }
      .dot { animation: blink 1.2s infinite; }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
      .m1 { animation: model1 6s infinite; }
      .m2 { animation: model2 6s infinite; }
      .m3 { animation: model3 6s infinite; }
      @keyframes model1 { 0%, 30% { fill: #25d366; } 33%, 100% { fill: #3a4a54; } }
      @keyframes model2 { 0%, 30% { fill: #3a4a54; } 33%, 63% { fill: #25d366; } 66%, 100% { fill: #3a4a54; } }
      @keyframes model3 { 0%, 63% { fill: #3a4a54; } 66%, 97% { fill: #25d366; } 100% { fill: #3a4a54; } }
      .x1 { animation: fail1 6s infinite; } .x2 { animation: fail2 6s infinite; }
      @keyframes fail1 { 0%, 31% { opacity: 0; } 33%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes fail2 { 0%, 64% { opacity: 0; } 66%, 98% { opacity: 1; } 100% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 1010px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle class="pulse" cx="1010" cy="180" r="170" fill="url(#glow)"/>

  <!-- title -->
  <rect x="64" y="72" width="6" height="216" rx="3" fill="#25d366"/>
  <text x="96" y="104" class="mono" font-size="17" fill="#25d366" letter-spacing="2">WHATSAPP AI ASSISTANT</text>
  <text x="92" y="186" class="sans" font-size="92" font-weight="800" fill="url(#shine)">Luminus</text>
  <text x="96" y="228" class="sans" font-size="21" fill="#9fb3bd">Flask webhook, Celery queue, Gemini model pool, Postgres memory</text>

  <!-- model pool with fallback -->
  <text x="96" y="272" class="mono" font-size="13" fill="#6f8792">MODEL POOL</text>
  <g class="mono" font-size="13">
    <rect class="m1" x="190" y="256" width="150" height="24" rx="12"/>
    <text x="265" y="273" text-anchor="middle" fill="#0b141a" font-weight="700">gemini-2.5-flash</text>
    <text class="x1" x="345" y="273" fill="#ef4444">✕</text>
    <rect class="m2" x="362" y="256" width="150" height="24" rx="12"/>
    <text x="437" y="273" text-anchor="middle" fill="#0b141a" font-weight="700">gemini-2.0-flash</text>
    <text class="x2" x="517" y="273" fill="#ef4444">✕</text>
    <rect class="m3" x="534" y="256" width="176" height="24" rx="12"/>
    <text x="622" y="273" text-anchor="middle" fill="#0b141a" font-weight="700">gemini-2.0-flash-lite</text>
  </g>
  <text x="96" y="306" class="sans" font-size="13" fill="#6f8792">quota exceeded? the next model answers</text>

  <!-- phone -->
  <rect x="860" y="28" width="300" height="304" rx="28" fill="#111b21" stroke="#2a3942" stroke-width="2"/>
  <rect x="860" y="28" width="300" height="52" rx="28" fill="#202c33"/>
  <rect x="860" y="56" width="300" height="24" fill="#202c33"/>
  <circle cx="894" cy="54" r="15" fill="#25d366"/>
  <text x="894" y="60" text-anchor="middle" class="sans" font-size="15" font-weight="800" fill="#0b141a">L</text>
  <text x="918" y="50" class="sans" font-size="15" font-weight="700" fill="#e9edef">Luminus</text>
  <text x="918" y="67" class="sans" font-size="11" fill="#25d366">online</text>

  <!-- conversation -->
  <g class="in1 sans">
    <rect x="876" y="96" width="196" height="38" rx="10" fill="#202c33"/>
    <text x="890" y="120" font-size="13" fill="#e9edef">/secretary what's on today?</text>
  </g>
  <g class="typing">
    <rect x="1070" y="146" width="66" height="30" rx="10" fill="#005c4b"/>
    <g fill="#d1f4e5"><circle class="dot" cx="1088" cy="161" r="4"/><circle class="dot" cx="1103" cy="161" r="4"/><circle class="dot" cx="1118" cy="161" r="4"/></g>
  </g>
  <g class="out1 sans">
    <rect x="938" y="146" width="206" height="54" rx="10" fill="#005c4b"/>
    <text x="952" y="168" font-size="13" fill="#e9edef">2 meetings, 1 approval</text>
    <text x="952" y="188" font-size="13" fill="#e9edef">pending. Want the list?</text>
  </g>
  <g class="in2 sans">
    <rect x="876" y="212" width="90" height="36" rx="10" fill="#202c33"/>
    <text x="890" y="235" font-size="13" fill="#e9edef">yes please</text>
  </g>
  <g class="out2 sans">
    <rect x="958" y="260" width="186" height="54" rx="10" fill="#005c4b"/>
    <text x="972" y="282" font-size="13" fill="#e9edef">09:30 Supplier call</text>
    <text x="972" y="302" font-size="13" fill="#e9edef">14:00 Budget review</text>
  </g>
</svg>
